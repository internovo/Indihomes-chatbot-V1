# Deploys this service to the Azure App Service STAGING slot.
#
# Production is never deployed to directly. The flow is:
#   push to main -> tests -> staging slot -> smoke test -> manual slot swap
# The swap is the cutover, and swapping back is the rollback.
#
# Requires three repository secrets, from the service principal the cloud
# team creates (OIDC federated credential - no long-lived secret is stored
# here): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# The app itself is built on Azure by Oryx, not here, so the runtime that
# runs in production is the one Azure produced. That needs the app setting
# SCM_DO_BUILD_DURING_DEPLOYMENT=true, which the migration sets.
name: Deploy to Azure (staging slot)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC login to Azure
  contents: read

env:
  AZURE_WEBAPP_NAME: indihomes-chatbot-v1
  AZURE_SLOT_NAME: staging
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # No GROQ_API_KEY / Google creds needed: the suite mocks every
        # outbound call. If a test ever starts needing a real key, that
        # test is doing too much - fix the test, do not add the secret.
        run: python -m unittest discover -s tests -v

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          package: .

      - name: Smoke test staging /health
        # Fails the run if staging does not come back healthy, so a broken
        # build is visible here rather than discovered during a slot swap.
        run: |
          set -e
          URL="https://${{ env.AZURE_WEBAPP_NAME }}-${{ env.AZURE_SLOT_NAME }}.azurewebsites.net/health"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "staging healthy:"; cat /tmp/health.json; exit 0
            fi
            echo "attempt $i: HTTP $code - waiting for the app to start"; sleep 15
          done
          echo "staging did not return 200 from /health"; cat /tmp/health.json || true; exit 1
